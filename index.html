<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presente Confetes</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            overflow: hidden; /* Esconde os confetes que saem da tela */
        }

        .container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .imagem-centro {
            max-width: 500px; /* Ajuste o tamanho conforme necessário */
            width: 80%;
            z-index: 10; /* Garante que a imagem fique acima dos confetes */
        }

        .confetti-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Permite interagir com elementos abaixo */
        }

        .confetti {
            width: 10px;
            height: 15px;
            background-color: #f00;
            position: absolute;
            opacity: 0;
            animation: fall 3s linear infinite;
            transform-origin: 50% -50%; /* Define o ponto de origem para a rotação */
        }

        /* Cores variadas para os confetes */
        .confetti:nth-child(3n) { background-color: #0f0; }
        .confetti:nth-child(5n) { background-color: #00f; }
        .confetti:nth-child(7n) { background-color: #ff0; }
        .confetti:nth-child(11n) { background-color: #0ff; }
        .confetti:nth-child(13n) { background-color: #f0f; }
        .confetti:nth-child(17n) { background-color: #ffa500; }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="URL_DA_SUA_IMAGEM.jpg" alt="Seu Presente" class="imagem-centro">
        <div class="confetti-container" id="confettiContainer">
            </div>
    </div>

    <script>
        const confettiContainer = document.getElementById('confettiContainer');
        const numberOfConfetti = 200; // Ajuste a quantidade de confetes

        function createConfetti() {
            for (let i = 0; i < numberOfConfetti; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = `${Math.random() * 100}vw`;
                confetti.style.animationDelay = `${Math.random() * 3}s`;
                confetti.style.width = `${Math.random() * 10 + 5}px`;
                confetti.style.height = `${Math.random() * 15 + 10}px`;
                confetti.style.rotate = `${Math.random() * 360}deg`;
                confettiContainer.appendChild(confetti);
            }
        }

        createConfetti();
    </script>
</body>
</html>
